{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Sign Up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body{

            background: linear-gradient(
                to right,
                #eef2ff,
                #f7f9ff
            );

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;
        }

        .signup-box{

            background:white;

            padding:40px;

            width:420px;

            border-radius:25px;

            box-shadow:0 8px 25px rgba(0,0,0,0.08);
        }

        .logo{

            width:90px;

            display:block;

            margin:auto;
        }

        .title{

            text-align:center;

            color:#5b5bff;

            font-weight:bold;

            margin-top:15px;
        }

        .custom-input{

            border-radius:12px;

            padding:12px;
        }

        .signup-btn{

            background:linear-gradient(
                to right,
                #667eea,
                #764ba2
            );

            border:none;

            color:white;

            padding:12px;

            border-radius:12px;

            width:100%;
        }

    </style>

</head>

<body>

<div class="signup-box">

    <img src="C:\Users\LENOVO\Desktop\to-do_task\TO_DO_TASK\TO_DO_TASK\Templates\static\images\logo.png">

    <h2 class="title">

        Create Account

    </h2>

    <div class="mt-3">

        <input type="text"
        class="form-control custom-input"
        placeholder="Full Name">

    </div>

    <div class="mt-3">

        <input type="email"
        class="form-control custom-input"
        placeholder="Email">

    </div>

    <div class="mt-3">

        <input type="password"
        class="form-control custom-input"
        placeholder="Password">

    </div>

    <button class="signup-btn mt-4">

        Sign Up

    </button>

    <p class="text-center mt-3">

        Already have account?

        <a href="/login/">

            Login

        </a>

    </p>

</div>

</body>
</html>
