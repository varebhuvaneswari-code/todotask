{% extends "base.html" %}
{% block title %}Reset password | TodoFlow{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card slide-up">
    <h1>Reset password</h1>
    <p class="text-muted">Enter the email used on your account. TodoFlow sends a secure password reset link when SMTP is configured.</p>
    <form method="post">{% csrf_token %}
        <div class="form-floating mb-3">{{ form.email }}<label for="{{ form.email.id_for_label }}">Email address</label>{{ form.email.errors }}</div>
        <button class="btn btn-primary w-100">Send reset link</button>
    </form>
</div></div>
{% endblock %}
