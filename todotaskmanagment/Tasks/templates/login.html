{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body{

            background: linear-gradient(
                to right,
                #eef2ff,
                #f7f9ff
            );

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;
        }

        .login-box{

            background:white;

            padding:40px;

            width:400px;

            border-radius:25px;

            box-shadow:0 8px 25px rgba(0,0,0,0.08);

            animation:fadeIn 1s ease;
        }

        .logo{

            width:90px;

            display:block;

            margin:auto;
        }

        .title{

            text-align:center;

            margin-top:15px;

            color:#5b5bff;

            font-weight:bold;
        }

        .custom-input{

            border-radius:12px;

            padding:12px;
        }

        .login-btn{

            background:linear-gradient(
                to right,
                #667eea,
                #764ba2
            );

            border:none;

            color:white;

            padding:12px;

            border-radius:12px;

            width:100%;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

    </style>

</head>

<body>

<div class="login-box">

   <img src="C:\Users\LENOVO\Desktop\to-do_task\TO_DO_TASK\TO_DO_TASK\Templates\static\images\logo.png">

    <h2 class="title">

        SmartTasks Login

    </h2>

    <div class="mt-4">

        <input type="email"
        class="form-control custom-input"
        placeholder="Enter Email">

    </div>

    <div class="mt-3">

        <input type="password"
        class="form-control custom-input"
        placeholder="Enter Password">

    </div>

    <button class="login-btn mt-4">

        Login

    </button>

    <p class="text-center mt-3">

        Don't have account?

        <a href="/signup/">

            Sign Up

        </a>

    </p>

</div>

</body>
</html>
