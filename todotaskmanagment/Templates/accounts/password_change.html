{% extends "base.html" %}
{% block title %}Change password | TodoFlow{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card slide-up">
    <h1>Change password</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <div class="form-floating password-field mb-3">
                {{ field }}<label for="{{ field.id_for_label }}">{{ field.label }}</label>
                <button class="password-toggle" type="button" data-password-toggle><i class="bi bi-eye"></i></button>
                {{ field.errors }}
            </div>
        {% endfor %}
        <button class="btn btn-primary w-100">Update password</button>
    </form>
</div></div>
{% endblock %}
